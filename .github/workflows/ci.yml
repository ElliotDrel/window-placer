name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select Rust
        run: rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Tests (test-owned windows only)
        run: cargo test --locked -- --test-threads=1
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release
      - name: Stage portable bundle and validate documentation encoding
        run: |
          $utf8 = [Text.UTF8Encoding]::new($false, $true)
          Get-ChildItem README.md,docs -Recurse -File | ForEach-Object { $null = $utf8.GetString([IO.File]::ReadAllBytes($_.FullName)) }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/window-placer.exe,windows.conf,Setup.cmd,Status.cmd,Debug.cmd,README.md,LICENSE -Destination dist
          Copy-Item scripts,docs -Destination dist -Recurse
      - name: Startup shortcut and launcher lifecycle (staged bundle)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/startup.ps1 -BinaryPath dist/window-placer.exe -SourceDirectory dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: window-placer-windows-x64
          path: dist/
